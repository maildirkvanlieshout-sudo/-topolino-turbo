<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Topolino Turbo</title>
  <style>
    :root{
      --bg:#0e1626;
      --panel:#18243a;
      --yellow:#ffd43b;
      --white:#f7f9fc;
      --muted:#a8b3c7;
      --road:#3b3f46;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--white);overflow:hidden}
    body{display:flex;flex-direction:column}
    header{
      height:72px;flex:0 0 72px;display:flex;align-items:center;justify-content:space-between;
      gap:10px;padding:0 14px;background:linear-gradient(180deg,#1b2942,#142033);
      box-shadow:0 3px 14px #0007;z-index:3
    }
    .brand{font-size:20px;font-weight:900;letter-spacing:.5px;white-space:nowrap}
    .brand span{color:var(--yellow)}
    .stats{display:flex;gap:16px;font-size:14px}
    .stats b{display:block;color:var(--yellow);font-size:18px}
    #wrap{position:relative;flex:1;min-height:0;display:flex;justify-content:center;background:#101827}
    canvas{height:100%;width:min(100vw,620px);display:block;background:var(--road);touch-action:none}
    #start,#restart{
      position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      border:0;border-radius:16px;background:var(--yellow);color:#111;padding:16px 26px;
      font-size:19px;font-weight:800;box-shadow:0 8px 30px #0008;cursor:pointer;z-index:4
    }
    #restart{display:none}
    #message{
      position:absolute;left:50%;top:38%;transform:translateX(-50%);
      width:min(88%,500px);text-align:center;font-size:18px;font-weight:800;
      text-shadow:0 2px 4px #000;z-index:3;pointer-events:none
    }
    .controls{
      position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;
      padding:0 26px;pointer-events:none;z-index:3
    }
    .controls button{
      pointer-events:auto;width:76px;height:76px;border-radius:50%;border:0;background:#ffd43be8;
      color:#111;font-size:32px;font-weight:900;box-shadow:0 6px 20px #0008;cursor:pointer;
      touch-action:manipulation
    }
    .controls button:active{transform:scale(.94)}
    .hint{
      position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
      color:#ffffff99;font-size:12px;z-index:2;pointer-events:none
    }
    @media (min-width:800px){
      .controls{padding:0 calc((100vw - 590px)/2)}
      .hint{bottom:10px}
    }
  </style>
</head>
<body>
<header>
  <div class="brand">🚗 TOPOLINO <span>TURBO</span></div>
  <div class="stats">
    <div>Score<b id="score">0</b></div>
    <div>Record<b id="best">0</b></div>
    <div>Turbo<b id="turbo">0%</b></div>
  </div>
</header>

<div id="wrap">
  <canvas id="game"></canvas>
  <div id="message">Ontwijk het verkeer en pak de ⚡ turbo-bolts.</div>
  <button id="start">Start race</button>
  <button id="restart">Opnieuw rijden</button>
  <div class="controls">
    <button id="left" aria-label="Links">◀</button>
    <button id="right" aria-label="Rechts">▶</button>
  </div>
  <div class="hint">Pijltjes of A/D • mobiel: knoppen</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('wrap');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const turboEl = document.getElementById('turbo');
  const startBtn = document.getElementById('start');
  const restartBtn = document.getElementById('restart');
  const msg = document.getElementById('message');

  let W=360,H=600,dpr=1;
  let running=false,last=0,spawnTimer=0,boltTimer=0,score=0,speed=310,turbo=0,turboTime=0;
  let best=Number(localStorage.getItem('topolinoTurboBest')||0);
  bestEl.textContent=best;

  const laneCount=3;
  const car={lane:1,y:0,w:52,h:88};
  let enemies=[],bolts=[],roadOffset=0;

  function resize(){
    const rect=wrap.getBoundingClientRect();
    const cssW=Math.min(rect.width,620);
    const cssH=rect.height;
    dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
    canvas.width=Math.floor(cssW*dpr);
    canvas.height=Math.floor(cssH*dpr);
    canvas.style.width=cssW+'px';
    canvas.style.height=cssH+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    W=cssW;H=cssH;
    car.y=H-135;
  }
  addEventListener('resize',resize);
  resize();

  function roadLeft(){ return W*0.08; }
  function roadWidth(){ return W*0.84; }
  function laneCenter(l){ return roadLeft()+roadWidth()*(l+.5)/laneCount; }

  function roundedRect(x,y,w,h,r){
    const rr=Math.min(r,w/2,h/2);
    ctx.beginPath();
    ctx.moveTo(x+rr,y);
    ctx.arcTo(x+w,y,x+w,y+h,rr);
    ctx.arcTo(x+w,y+h,x,y+h,rr);
    ctx.arcTo(x,y+h,x,y,rr);
    ctx.arcTo(x,y,x+w,y,rr);
    ctx.closePath();
  }

  function drawRoad(dt){
    ctx.fillStyle='#173a2d'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#3c4148'; ctx.fillRect(roadLeft(),0,roadWidth(),H);

    ctx.fillStyle='#e5e5e5';
    ctx.fillRect(roadLeft(),0,5,H);
    ctx.fillRect(roadLeft()+roadWidth()-5,0,5,H);

    roadOffset=(roadOffset + speed*dt) % 120;
    ctx.fillStyle='#f3f3f3';
    for(let l=1;l<laneCount;l++){
      const x=roadLeft()+roadWidth()*l/laneCount;
      for(let y=-120+roadOffset;y<H;y+=120) ctx.fillRect(x-3,y,6,58);
    }

    for(let y=-40+(roadOffset*.45)%80;y<H;y+=80){
      ctx.fillStyle='#8bcf6a';
      ctx.beginPath(); ctx.arc(roadLeft()-18,y,5,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(roadLeft()+roadWidth()+18,y+28,5,0,Math.PI*2); ctx.fill();
    }
  }

  function drawCar(cx,y,color,player=false){
    ctx.save();
    ctx.translate(cx,y);
    ctx.fillStyle='rgba(0,0,0,.3)';
    roundedRect(-29,6,58,88,13); ctx.fill();

    ctx.fillStyle=color;
    roundedRect(-27,0,54,86,13); ctx.fill();

    ctx.fillStyle='#aee9ff';
    roundedRect(-18,11,36,20,7); ctx.fill();
    ctx.fillStyle='#7bb8d0';
    roundedRect(-18,50,36,16,6); ctx.fill();

    ctx.fillStyle='#111';
    ctx.fillRect(-32,16,7,22); ctx.fillRect(25,16,7,22);
    ctx.fillRect(-32,57,7,22); ctx.fillRect(25,57,7,22);

    ctx.fillStyle='#fff7b0';
    ctx.fillRect(-18,2,9,5); ctx.fillRect(9,2,9,5);
    ctx.fillStyle='#ff4343';
    ctx.fillRect(-18,78,9,5); ctx.fillRect(9,78,9,5);

    if(player){
      ctx.fillStyle='#111';
      ctx.font='bold 12px Arial';
      ctx.textAlign='center';
      ctx.fillText('500',0,45);
    }
    ctx.restore();
  }

  function spawnEnemy(){
    const colors=['#ef5350','#42a5f5','#ab47bc','#26a69a','#ffa726','#eceff1'];
    enemies.push({
      lane:Math.floor(Math.random()*laneCount),
      y:-110,
      w:50,h:84,
      color:colors[Math.floor(Math.random()*colors.length)],
      counted:false
    });
  }

  function spawnBolt(){
    bolts.push({lane:Math.floor(Math.random()*laneCount),y:-40,r:13});
  }

  function overlapLaneObj(obj){
    return obj.lane===car.lane && obj.y+obj.h>car.y+5 && obj.y<car.y+car.h-5;
  }

  function drawBolt(b){
    const x=laneCenter(b.lane);
    ctx.save();
    ctx.translate(x,b.y);
    ctx.fillStyle='#ffd43b';
    ctx.beginPath();
    ctx.moveTo(-5,-15); ctx.lineTo(8,-15); ctx.lineTo(1,-2);
    ctx.lineTo(10,-2); ctx.lineTo(-8,16); ctx.lineTo(-2,3);
    ctx.lineTo(-11,3); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function endGame(){
    running=false;
    best=Math.max(best,score);
    localStorage.setItem('topolinoTurboBest',best);
    bestEl.textContent=best;
    msg.innerHTML=`BOEM!<br><span style="font-size:15px;font-weight:600">Score: ${score}</span>`;
    restartBtn.style.display='block';
  }

  function reset(){
    enemies=[];bolts=[];score=0;speed=310;turbo=0;turboTime=0;spawnTimer=0;boltTimer=0;roadOffset=0;
    car.lane=1;car.y=H-135;
    scoreEl.textContent='0';turboEl.textContent='0%';
    msg.textContent='Ontwijk het verkeer en pak de ⚡ turbo-bolts.';
    restartBtn.style.display='none'; startBtn.style.display='none';
    running=true; last=performance.now();
    requestAnimationFrame(loop);
  }

  function move(dir){
    if(!running)return;
    car.lane=Math.max(0,Math.min(laneCount-1,car.lane+dir));
  }

  function loop(now){
    if(!running)return;
    const dt=Math.min(.035,(now-last)/1000); last=now;

    spawnTimer+=dt;
    boltTimer+=dt;

    const difficulty=1+Math.min(1.4,score/55);
    const spawnEvery=Math.max(.48,1.15/difficulty);

    if(spawnTimer>=spawnEvery){ spawnEnemy(); spawnTimer=0; }
    if(boltTimer>=4.2){ spawnBolt(); boltTimer=0; }

    if(turboTime>0){
      turboTime-=dt;
      speed=500;
    }else{
      speed=310+Math.min(230,score*5);
    }

    drawRoad(dt);

    for(const e of enemies){
      e.y += speed*dt;
      drawCar(laneCenter(e.lane),e.y,e.color,false);
      if(overlapLaneObj(e)){ endGame(); return; }
      if(e.y>H+100 && !e.counted){ e.counted=true; score++; scoreEl.textContent=score; }
    }
    enemies=enemies.filter(e=>e.y<H+130);

    for(const b of bolts){
      b.y += speed*dt;
      drawBolt(b);
      if(b.lane===car.lane && b.y+18>car.y && b.y-18<car.y+car.h){
        b.hit=true;
        turbo=Math.min(100,turbo+25);
        turboEl.textContent=turbo+'%';
      }
    }
    bolts=bolts.filter(b=>!b.hit && b.y<H+50);

    if(turbo>=100 && turboTime<=0){
      turbo=0; turboTime=2.3; turboEl.textContent='BOOST!';
    }else if(turboTime<=0){
      turboEl.textContent=turbo+'%';
    }

    drawCar(laneCenter(car.lane),car.y,'#ffd43b',true);

    ctx.fillStyle='rgba(255,255,255,.92)';
    ctx.font='bold 13px Arial';
    ctx.textAlign='left';
    ctx.fillText('Snelheid '+Math.round(speed/6)+' km/u',roadLeft()+10,24);

    requestAnimationFrame(loop);
  }

  document.getElementById('left').addEventListener('pointerdown',()=>move(-1));
  document.getElementById('right').addEventListener('pointerdown',()=>move(1));
  addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a') move(-1);
    if(e.key==='ArrowRight'||e.key.toLowerCase()==='d') move(1);
    if((e.key===' '||e.key==='Enter')&&!running) reset();
  });

  startBtn.addEventListener('click',reset);
  restartBtn.addEventListener('click',reset);
})();
</script>
</body>
</html>
